# UBP 로봇 전용 설정.
# - 시뮬레이션 (pybullet) 또는 실 로봇 (dynamixel) publisher 선택.
# - shoulder_pitch ±3.14 잠정 (사용자 추후 조정).
# - 안전 자세 모든 관절 0.0 (사용자 결정).
# - 책상 시나리오 대비 min_visibility 0.1.

tracker:
  type: realsense
  realsense:
    color_resolution: [640, 480]
    depth_resolution: [640, 480]
    fps: 30
    align_to: color
    enable_imu: false
    depth_max_m: 4.0
    # 모델 선택: lite (5MB, 빠름) / full (9MB, 균형) / heavy (29MB, 정확)
    # heavy 모델로 keypoint 위치 정확도 큰 폭 향상. 단 첫 로드 5초 추가.
    model_asset_path: ./models/pose_landmarker_heavy.task
    # ★ 핵심: MediaPipe의 pose_world_landmarks (3D meters, hip-centered) 사용.
    #    false = RealSense depth + 픽셀 deproject (얇은 부위 노이즈 큼).
    #    true = MediaPipe 3D pose model 사용 (Yi 2012의 NiTE와 유사한 접근).
    use_world_landmarks: true
    # Gravity-aligned aligner: 운영자의 토르소 tilt 와 무관하게 world up 으로 v 고정.
    # 운영자가 자연스레 앞으로 살짝 기울어진 자세에서도 sh_r 과대 추정 방지.
    # null → body-relative (head - mid_hip, 기존 동작)
    # MediaPipe pose_world_landmarks 의 +y 가 image-down 이면 [0,-1,0], up 이면 [0,1,0].
    # 처음 실행 후 debug_retarget 의 [AXIS] 로그 보고 결정. 일단 추정값.
    gravity_up: [0.0, -1.0, 0.0]
    # Body pose backend. "hmr2" (GPU, SMPL-prior 모델 3D → forward/back(z) 안정 +
    # 가림 robust — default), "rtmpose" (GPU, rtmlib+onnxruntime, 2D + depth deproject;
    # 얇은 부위 z 노이즈로 앞뒤 불안정), "mediapipe" (CPU, BlazePose Heavy).
    # hmr2: scripts/install_hmr2.ps1 로 4D-Humans + 체크포인트 + SMPL_NEUTRAL.pkl 설치 필요.
    # 다른 백엔드로 되돌리려면 이 값만 바꾸면 됨 (다른 키는 보존).
    body_backend: rtmpose
    # rtmpose 견고한 깊이 복원 (body_backend: rtmpose 일 때만). RealSense depth 를
    # 제대로 활용해 elbow 압축·앞뒤 떨림 동시 해결. tracker/depth_lift.py 참고.
    depth_lift:
      enabled: true               # false → 레거시 3x3 median
      window: 7                   # 깊이 샘플 창 크기(px). 얇은 팔이면 7~9 권장
      foreground_percentile: 40   # 창 안에서 가까운 N% (몸 표면)만 채택 → 배경섞임 차단
      max_jump_m: 0.25            # 프레임당 이보다 큰 깊이 점프는 스파이크로 보고 1프레임 보류
      max_stale_frames: 5         # 깊이 홀일 때 직전 유효값 재사용 최대 프레임 수
      bone_stabilize: true        # 온라인 뼈길이 정규화(shoulder→elbow→wrist) z지터 억제
      bone_history: 60            # 뼈길이 running-median 윈도우(프레임)
      bone_ratio_min: 0.5         # 길이 보정 비율 하한 (급변 방지)
      bone_ratio_max: 2.0         # 길이 보정 비율 상한
    # hmr2 backend params (body_backend: hmr2 일 때만)
    hmr2_device: cuda             # "cuda" or "cpu" (CPU 는 unusable, >1s/frame)
    hmr2_checkpoint_path: null    # null → load_hmr2 가 auto-download (~/.cache/4DHumans)
    hmr2_bbox_padding: 0.15       # MediaPipe bbox 를 15% 확장 후 HMR2 에 전달
    # rtmpose backend params (body_backend: rtmpose 일 때만). RTMPose 는 2D 만
    # 내므로 use_world_landmarks 무시 → 항상 RealSense depth deproject 사용.
    rtmpose_mode: balanced        # "performance" | "lightweight" | "balanced"
    rtmpose_device: cuda          # "cuda" | "cpu" | "mps"
    rtmpose_onnx_backend: onnxruntime  # "onnxruntime" | "opencv" | "openvino"

    # Hand tracking backend. "mediapipe" (CPU, 7.5 MB, ~50% 검출률) 또는
    # "hamer" (GPU 필수, ~1.5 GB, ~100% 검출률, MANO 라이센스 등록 필요).
    # null/off → 손 추적 비활성 (w_yaw/w_pitch 는 0 passthrough).
    hand_backend: mediapipe
    # mediapipe backend params
    hand_model_asset_path: ./models/hand_landmarker.task
    hand_min_confidence: 0.5
    # hamer backend params — scripts/install_hamer.ps1 로 설치 후 활성화.
    hamer_device: cuda             # "cuda" or "cpu" (CPU 는 ~500 ms/hand, 사실상 unusable)
    hamer_checkpoint_path: null    # null → HaMeR default (~/.cache/hamer)
    mano_dir: null                 # null → HaMeR default (<hamer_repo>/_DATA/data/mano)
  pose:
    model: mediapipe_pose_lite
    min_visibility: 0.1
  mock:
    jsonl_path: null
    loop: true

retarget:
  robot:
    # URDF 길이와 동기화 — 사용자 실측치로 교체
    upper_arm_length: 0.25
    lower_arm_length: 0.25
    shoulder_offset: [0.0, 0.18, 0.10]
  operator_calibration: t_pose_hold
  fixed_arm_length: 0.55
  calibration_frames: 30
  # theta_1 = atan2(z,x) - theta_5 (Yi 2012 식 3). false = 논문 그대로 (-theta_5 유지).
  # true 로 두면 -theta_5 를 제거(MediaPipe elbow 노이즈 격리용 변형)했었으나, RTMPose+
  # 견고깊이로 elbow 키포인트가 안정되어 논문 충실 모드(false)로 복원.
  decouple_pitch_elbow: false
  # ===== Per-joint REST-POSE OFFSET =====
  # 캘리브레이션 단계에서 자동 캡쳐 (default). 운영자가 calibration_frames 동안
  # 양팔 자연스럽게 hang → 그 자세의 retargeter 출력 평균을 rest_offsets 로 사용
  # → robot zero = 운영자 rest. 해부학적 비대칭 (오른어깨 forward 등) 자동 보정.
  #
  # 아래 dict 에 값을 명시하면 해당 joint 만 manual override (auto 값 무시).
  # 모든 joint auto 사용 시 null 또는 비워둠.
  rest_offsets: null
  # Per-joint motion scaling — robot이 운영자 동작의 N배로 따라감.
  # 1.0 = 그대로, 1.2 = 120% (amplify, 작은 motion도 robot이 더 크게 따라함),
  # 0.5 = 절반. 양팔 비대칭 (왼팔 좋고 오른팔 못따라가는 경우) 보정에 사용:
  #   r_shoulder_*: 1.2~1.5 로 올려서 오른팔 더 크게 반응시킴.
  output_gain:
    r_shoulder_pitch: 1.0
    l_shoulder_pitch: 1.0
    r_shoulder_roll: 1.0
    l_shoulder_roll: 1.0
    r_shoulder_yaw: 1.0
    l_shoulder_yaw: 1.0
    # HMR2 가 elbow 굴곡을 ~3.3배 과소평가함(정면뷰+SMPL prior 깊이 평균회귀).
    # 운영자 90도 굽힘 → retarget elbow 동적범위 ~27도뿐. 압축비만큼 증폭해 보정.
    # debug_elbow.py 측정 근거. 정지시 jitter 거슬리면 keypoint_smoother 강화 또는 값 ↓.
    r_elbow: 3.0
    l_elbow: 3.0
    r_wrist_yaw: 1.0
    l_wrist_yaw: 1.0
    r_wrist_pitch: 1.0
    l_wrist_pitch: 1.0
    torso_yaw: 1.0
    neck_yaw: 1.0
    head_pitch: 1.0

# ===== ROBOT MODEL (numerical task-space IK) =====
# core/robot_model.py + core/numik.py. 자료(Ryan/Jiang/OmniDP/MIRROR) 기반 표준:
# 로봇 모델 위에서 elbow+wrist 위치를 동시에 추종하는 수치 IK (Jiang의 joint+
# Cartesian 절충). 해석 IK(Yi 2012)의 굽힘 부정확을 제거. app.sim_teleop --ik numeric.
#
# ★ URDF/xacro/sdf 드롭인: 실제 로봇 받으면 아래 4개만 바꾸면 즉시 적용됨 —
#   model_path / arms.*.{shoulder,elbow,wrist}_body / arms.*.joints / operator_to_robot_R.
#   링크 길이·어깨 위치는 모델에서 자동 측정(임의 치수 자동 대체).
#   - URDF: MuJoCo from_xml_path 가 직접 로드 (필요시 URDF 안에 <mujoco><compiler/> 추가).
#   - xacro: `xacro robot.xacro > robot.urdf` 먼저 → 생성된 urdf 지정.
#   - SDF: MuJoCo 미지원 → URDF/MJCF 로 변환 후 사용.
robot:
  model_path: ./models/upperbody_sim.xml
  # 운영자 torso 프레임(+x right,+y up,+z fwd) → 로봇 world 프레임 회전.
  # upperbody_sim 은 root euler 로 y-up torso 를 z-up world 로: (x,y,z)→(x,-z,y).
  # 실제 로봇 URDF 의 base 좌표계에 맞춰 이 행렬만 교체.
  operator_to_robot_R: [[1, 0, 0], [0, 0, -1], [0, 1, 0]]
  ik:
    damping: 0.08        # DLS λ (m). 특이점 안정성↔수렴속도
    max_iters: 16        # 프레임당 반복 (워밍스타트라 보통 2~5회면 수렴)
    pos_tol: 0.002       # 수렴 허용오차 (m)
    step_clip: 0.35      # 반복당 관절 변화 상한 (rad)
  # ===== JOINT LIMITS (IK 전용, rad) =====
  # IK가 반복마다 + 최종 커맨드에서 각 관절을 아래 [min,max]로 clamp 한다.
  # ★ 모델(jnt_range)보다 우선 적용 — 여기 있는 관절만 덮어쓰고, 없으면 모델값 사용.
  #   실제 로봇 받으면 이 블록을 로봇 사양으로 채우면 됨(모델 안 고쳐도 됨).
  # 어깨 pitch/roll 은 주 자유도라 넓게, shoulder_yaw(상완 트위스트)는 좁혀
  # 비정상 비틀림(DLS 여유자유도 폭주)을 막고, elbow 는 과신전 방지(0~).
  joint_limits:
    r_shoulder_pitch: [-3.14, 3.14]
    r_shoulder_roll:  [-3.14, 3.14]
    r_shoulder_yaw:   [-1.57, 1.57]
    r_elbow:          [0.0, 2.79]
    l_shoulder_pitch: [-3.14, 3.14]
    l_shoulder_roll:  [-3.14, 3.14]
    l_shoulder_yaw:   [-1.57, 1.57]
    l_elbow:          [0.0, 2.79]
  arms:
    right:
      joints: [r_shoulder_pitch_joint, r_shoulder_roll_joint, r_shoulder_yaw_joint, r_elbow_joint]
      shoulder_body: r_shoulder_pitch_link
      elbow_body: r_elbow_link
      wrist_body: r_hand_link
    left:
      joints: [l_shoulder_pitch_joint, l_shoulder_roll_joint, l_shoulder_yaw_joint, l_elbow_joint]
      shoulder_body: l_shoulder_pitch_link
      elbow_body: l_elbow_link
      wrist_body: l_hand_link

filter:
  # ===== 튜닝 가이드 =====
  # world_landmarks 사용 후 노이즈가 줄어 smoothing 약화 가능.
  # 빠른 motion 반응 → min_cutoff 올림 / beta 올림
  # 차분히 → min_cutoff 내림
  # =======================
  # 3D keypoint smoother — world_landmarks 사용 시 매우 약하게 가능
  keypoint_smoother:
    min_cutoff: 1.5    # 0.3 → 1.5 (빠른 반응)
    beta: 0.03         # 0.005 → 0.03
    d_cutoff: 1.0
  # 관절 각도 smoother
  one_euro:
    min_cutoff: 3.0    # 1.0 → 3.0 (responsive)
    beta: 0.07         # 0.02 → 0.07
    d_cutoff: 1.0
  joint_limits_factor: 0.9
  max_velocity_rad_s: 8.0   # 4.0 → 8.0 (빠른 motion 허용)
  velocity_violation_factor: 50.0
  mechanical_limits:
    # UBP: 14 DOF (no torso_yaw, torso is fixed)
    r_shoulder_pitch: [-3.14, 3.14]
    r_shoulder_roll:  [-3.14, 3.14]
    r_shoulder_yaw:   [-3.14, 3.14]
    r_elbow:          [0.0, 2.79]
    r_wrist_yaw:      [-3.14, 3.14]
    r_wrist_pitch:    [-1.57, 1.57]
    l_shoulder_pitch: [-3.14, 3.14]
    l_shoulder_roll:  [-3.14, 3.14]
    l_shoulder_yaw:   [-3.14, 3.14]
    l_elbow:          [0.0, 2.79]
    l_wrist_yaw:      [-3.14, 3.14]
    l_wrist_pitch:    [-1.57, 1.57]
    neck_yaw:         [-1.57, 1.57]
    head_pitch:       [-1.0, 1.0]

publisher:
  type: pybullet      # 또는 mujoco / dynamixel / mock
  rate_hz: 100
  log_path: null
  pybullet:
    urdf_path: ./models/ubp.urdf
    gui: true               # GUI 창 띄움 (테스트는 false로)
    fixed_base: true        # 토르소 고정 (지지 베이스 가정)
    init_pose: [0.0, 0.0, 0.0]   # base_link 위치 (x, y, z)
  mujoco:
    model_path: ./models/ubp.xml  # MJCF native format
    gui: true               # mujoco.viewer.launch_passive
  dynamixel:
    port: COM5              # PYO님 환경에 맞게 변경
    baud: 1000000
    # Servo ID + 모델 — 사용자 확정 후 ID 채우기 (14 DOF, no torso_yaw)
    servos:
      r_shoulder_pitch: {id: 1,  model: MX-64}
      l_shoulder_pitch: {id: 2,  model: MX-64}
      r_shoulder_roll:  {id: 3,  model: MX-64}
      l_shoulder_roll:  {id: 4,  model: MX-64}
      r_shoulder_yaw:   {id: 5,  model: MX-28}   # upper arm twist
      l_shoulder_yaw:   {id: 6,  model: MX-28}
      r_elbow:          {id: 7,  model: MX-28}
      l_elbow:          {id: 8,  model: MX-28}
      r_wrist_yaw:      {id: 9,  model: MX-28}   # forearm twist
      l_wrist_yaw:      {id: 10, model: MX-28}
      r_wrist_pitch:    {id: 11, model: XL430}
      l_wrist_pitch:    {id: 12, model: XL430}
      # neck_yaw + head_pitch 는 2XL430 1개 액추에이터 (축 2개, ID 2개)
      neck_yaw:         {id: 13, model: 2XL430}
      head_pitch:       {id: 14, model: 2XL430}

safety:
  deadman:
    type: keyboard
    key: space
  estop_key: esc
  confidence_threshold: 0.5
  loss_grace_period_s: 0.5
  ramp_to_safe_s: 1.5
  watchdog_factor: 3
  # UBP: 모든 관절 0 rad (사용자 결정, 14 DOF)
  safe_pose:
    r_shoulder_pitch: 0.0
    r_shoulder_roll: 0.0
    r_shoulder_yaw: 0.0
    r_elbow: 0.0
    r_wrist_yaw: 0.0
    r_wrist_pitch: 0.0
    l_shoulder_pitch: 0.0
    l_shoulder_roll: 0.0
    l_shoulder_yaw: 0.0
    l_elbow: 0.0
    l_wrist_yaw: 0.0
    l_wrist_pitch: 0.0
    neck_yaw: 0.0
    head_pitch: 0.0

main:
  loop_rate_hz: 60
  latency_log_every: 30
  latency_p95_budget_s: 0.1
