# UBP 로봇 전용 설정 — 진입점(orchestrator).
# 파라미터는 용도별 파일로 분리되어 있고, 아래 include 순서대로 deep-merge 된다.
# (core/config.py: load_config). 실행은 그대로 `--config .\config\ubp.yaml`.
#
#   tracker.yaml       카메라/포즈 추정 입력
#   retarget.yaml      해석 retargeter (Yi-2012, --ik analytic / legacy main)
#   robot.yaml         수치 IK 로봇 모델 (--ik numeric)
#   filter.yaml        출력 필터/리미터 (smoothing, 속도제한)
#   joint_limit.yaml   ★ 모든 관절 한계(IK + 기계적) — 로봇 받으면 이 파일만 수정
#   publisher.yaml     출력 publisher (sim / dynamixel / mock)
#   safety.yaml        안전 레이어 (deadman/e-stop/safe pose)
#   runtime.yaml       메인 루프 파라미터
#
# 한 값만 임시로 덮어쓰려면 이 파일 본문에 같은 키를 적으면 include 보다 우선한다.
# 예) 잠깐 다른 모델로:  robot: { model_path: ./models/your_robot.urdf }
include:
  - tracker.yaml
  - retarget.yaml
  - robot.yaml
  - filter.yaml
  - joint_limit.yaml
  - publisher.yaml
  - safety.yaml
  - runtime.yaml
