# 일반 mock/replay 용 진입점. ubp.yaml 과 같은 include 구조를 쓰고, mock 실행에
# 필요한 값만 덮어쓴다.
#
# 예전에는 모든 값을 이 파일에 통째로 복사해 뒀는데, ubp.yaml 이 용도별 파일로
# 쪼개진 뒤로 두 벌이 따로 흘러가 버렸다(관절 한계·필터 계수·safe_pose 가 서로
# 다른 값이 됨). 같은 파일들을 include 해서 그 drift 를 구조적으로 막는다.
include:
  - tracker.yaml
  - retarget.yaml
  - robot.yaml
  - filter.yaml
  - joint_limit.yaml
  - publisher.yaml
  - safety.yaml
  - runtime.yaml

# ---- mock/replay 전용 override ----
tracker:
  type: mock
  realsense:
    # 카메라를 안 쓰므로 GPU 백엔드/IMU 를 끄고 가벼운 모델을 가리킨다.
    # (mock tracker 는 이 값들을 읽지 않지만, --tracker realsense 로 바꿔
    #  스모크 테스트할 때 CPU 만으로 뜨도록.)
    enable_imu: false
    body_backend: mediapipe
    hand_backend: null
    model_asset_path: ./models/pose_landmarker_lite.task

publisher:
  type: mock
