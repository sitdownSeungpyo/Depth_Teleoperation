# 진단용 오버레이 — 게이트를 전부 풀어 "왜 팔이 안 잡히나"를 볼 때 쓴다.
# 운용에는 쓰지 말 것: 명백히 틀린 keypoint 도 그대로 통과한다.
#
#   python -m app.main --config .\config\loose_visibility.yaml --tracker realsense ...
include:
  - default.yaml

tracker:
  pose:
    min_visibility: 0.1       # keypoint 하드 거부 사실상 해제
    min_arm_confidence: 0.0   # 팔 단위 confidence hold 해제

filter:
  # 속도 위반 거부도 사실상 해제 — 튐이 그대로 보여야 원인을 판별할 수 있다.
  velocity_violation_factor: 50.0
