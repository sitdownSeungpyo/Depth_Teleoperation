[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imitation_upper"
version = "0.1.0"
description = "Real-time upper-body imitation controller (Yi et al. 2012, RealSense D435i)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyrealsense2>=2.55,<3",
  "mediapipe>=0.10,<0.11",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pynput>=1.7",
  "pybullet>=3.2.6",        # sim publisher + URDF visualization
  # Required, not optional: core.numik / core.robot_model (the DEFAULT numeric
  # IK path), publisher.mujoco_publisher and app.sim_teleop all import it.
  "mujoco>=3.1",
  "dynamixel-sdk>=3.7",     # UART/RS485 direct servo control (UBP)
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.8",
]
# Heavy GPU dependencies for the HaMeR hand backend. Install via
# scripts/install_hamer.ps1 (also fetches weights + MANO instructions).
hamer = [
  "torch>=2.0",
  "torchvision>=0.15",
  # 'hamer' is installed via git+pip in install_hamer.ps1 (it isn't on PyPI).
]
# RTMPose body backend (GPU). Install via scripts/install_rtmpose.ps1, which
# also verifies the CUDAExecutionProvider is present.
rtmpose = [
  "rtmlib",
  "onnxruntime-gpu",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tracker*", "publisher*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests gate optional heavy deps with pytest.importorskip(), which must run
# before the imports it guards — E402 is the intended shape here.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
# core is the kinematics/safety heart and stays strict-clean; tracker and
# publisher are checked too so the depth/IK/IO seams keep their contracts.
# app/ is excluded — the debug and viz entrypoints are throwaway scripts.
files = ["core", "tracker", "publisher"]

# Third-party modules with no stubs / no py.typed, plus the optional GPU backends
# that may not be installed at all. Declared here in one place rather than as
# inline `# type: ignore` at each import — inline ignores duplicated this and then
# went stale (mypy flagged them as unused once the overrides existed).
[[tool.mypy.overrides]]
module = [
  "pyrealsense2.*", "mediapipe.*", "cv2.*", "pynput.*", "scipy.*", "yaml.*",
  "pybullet.*", "pybullet_data.*", "dynamixel_sdk.*", "mujoco.*",
  "rtmlib.*", "onnxruntime.*", "torch.*", "hamer.*", "hmr2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
